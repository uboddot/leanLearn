services:
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: lean-learn-frontend-container
    depends_on:
      - backend
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_PROXY_TARGET=http://backend:8080
    volumes:
      - ./frontend/src:/app/src
    ports:
      - "5173:5173"

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: lean-learn-backend-container
    ports:
      - "8080:8080"
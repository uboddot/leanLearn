services:

  db:
    image: postgres:17-alpine
    container_name: lean-learn-db-container
    environment:
      - POSTGRES_DB=leanlearn
      - POSTGRES_USER=leanlearn
      - POSTGRES_PASSWORD=leanlearn
    volumes:
      - lean-learn-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leanlearn -d leanlearn"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: lean-learn-backend-container
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/leanlearn
      - SPRING_DATASOURCE_USERNAME=leanlearn
      - SPRING_DATASOURCE_PASSWORD=leanlearn
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: lean-learn-frontend-container
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - CHOKIDAR_USEPOLLING=true
      # - VITE_API_PROXY_TARGET=http://host.docker.internal:8080
      - VITE_API_PROXY_TARGET=http://backend:8080
    volumes:
      - ./frontend/src:/app/src
    ports:
      - "5173:5173"

volumes:
  lean-learn-db-data:

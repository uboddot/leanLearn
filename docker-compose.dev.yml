services:
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: lean-learn-frontend-container
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend/src:/app/src
    ports:
      - "5173:5173"

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: lean-learn-backend-container
    ports:
      - "8080:8080"
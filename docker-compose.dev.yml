services:
  
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: lean-learn-backend-container
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
  
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: lean-learn-frontend-container
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - CHOKIDAR_USEPOLLING=true
      # - VITE_API_PROXY_TARGET=http://host.docker.internal:8080
      - VITE_API_PROXY_TARGET=http://backend:8080
    volumes:
      - ./frontend/src:/app/src
    ports:
      - "5173:5173"
      

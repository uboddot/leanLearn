name: build and push frontend image

on: push

jobs:
  build-and-push-frontend-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/frontend_lean_learn:latest ./frontend

      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository_owner }}/frontend_lean_learn:latest

  deploy-to-railway:
    runs-on: ubuntu-latest
    needs: build-and-push-frontend-image

    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service lean_learn_frontend

name: build and push backend image

on:
  push:
    branches: [main, dev, feature/setupBackend] # remove feature branch after closed
    paths:
      - "backend/**"

jobs:
  build-and-push-backend-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: docker build -f ./backend/Dockerfile -t ghcr.io/${{ github.repository_owner }}/backend_lean_learn:latest -t ghcr.io/${{ github.repository_owner }}/backend_lean_learn:${{ github.sha }} ./backend

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/backend_lean_learn:latest
          docker push ghcr.io/${{ github.repository_owner }}/backend_lean_learn:${{ github.sha }}

    generate-openapi-spec:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout repo
          uses: actions/checkout@v4

        - name: Set up JDK
          uses: actions/setup-java@v4
          with:
            java-version: "25"
            distribution: "temurin"
            cache: "maven"

        - name: Generate openapi.yml
          working-directory: backend
          run: ./mvnw verify -DskipTests=true

        - name: Upload openapi.yml artifact
          uses: actions/upload-artifact@v4
          with:
            name: openapi-spec
            path: backend/target/openapi.yml

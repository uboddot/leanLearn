name: Playwright Tests
on:
  push:
    paths:
      - "frontend/**"
    branches:
      - "**"
  pull_request:
    paths:
      - "frontend/**"
    branches: [main, dev]

# cancel in progress workflow, when a new one starts
concurrency:
  group: playwright-tests
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      # clone repo in github action runner
      - uses: actions/checkout@v4
      # setup node in runner with caching
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm clean install with package-lock.json to ensure consistent installs
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend Docker image
        run: docker build -t frontend-test ./frontend

      - name: Run frontend container
        run: docker run -d -p 8080:80 --name frontend-app frontend-test

      - name: print logs if docker container is not healthy
        if: ${{ failure() }}
        run: docker logs frontend-app

      - name: Wait for frontend
        run: npx --yes wait-on http://localhost:8080

      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: frontend
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:8080
        run: npx playwright test

      ######################################################################
      ####################### Artifacts and Reporting ######################
      ######################################################################

      # upload playwright report as artifact
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30
      - uses: actions/upload-pages-artifact@v3
        if: ${{ always() }}
        with:
          path: frontend/playwright-report/

  deploy-report:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Github Pages
        id: deployment
        uses: actions/deploy-pages@v4
